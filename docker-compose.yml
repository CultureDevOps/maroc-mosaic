services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    command:
      - sh
      - -c
      - node .yarn/releases/yarn-4.0.2.cjs install --immutable && exec node .yarn/releases/yarn-4.0.2.cjs dev --hostname 0.0.0.0
    volumes:
      - .:/app
      - maroc_mosaic_node_modules:/app/node_modules
      - maroc_mosaic_next:/app/.next
      - maroc_mosaic_contentlayer:/app/.contentlayer
      - maroc_mosaic_yarn_cache:/app/.yarn/cache
    ports:
      - "127.0.0.1:${SITE_PORT:-3002}:3000"

volumes:
  maroc_mosaic_node_modules:
  maroc_mosaic_next:
  maroc_mosaic_contentlayer:
  maroc_mosaic_yarn_cache:
